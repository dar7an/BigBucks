{% extends "base.html" %}
{% set active = 'search' %}
{% block title %}Search{% endblock %}
{% block content %}
<header class="page-head">
  <div>
    <p class="eyebrow">Search</p>
    <h1>Look up a ticker</h1>
    <p class="subhead">Quotes and charts read from stored history. Seeded symbols: {{ tickers|join(', ') }}.</p>
  </div>
</header>
<form method="post" class="card search-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="stock_symbol">Ticker</label>
    <input id="stock_symbol" name="stock_symbol" required autocomplete="off" spellcheck="false" list="ticker-list" placeholder="MSFT">
    <datalist id="ticker-list">
      {% for t in tickers %}
        <option value="{{ t }}"></option>
      {% endfor %}
    </datalist>
  </div>
  <div class="button-row">
    <button type="submit" name="action" value="search">View quote</button>
    <button type="submit" name="action" value="compare" class="button-quiet">Compare with SPY</button>
  </div>
</form>
{% endblock %}
